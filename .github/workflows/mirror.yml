name: Mirror tvbox-silicon to mmusic

# A full mirror must not contain any extra files, so the scheduler lives in
# this separate controller repository and pushes into mlzbest/mmusic.
on:
  schedule:
    - cron: '7 1 * * *'   # 01:07 UTC = 09:07 Asia/Shanghai, every day
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tvbox-silicon-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Mirror all refs from upstream
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${MIRROR_TOKEN:-}" ]; then
            echo "::error::MIRROR_TOKEN secret is missing"
            exit 1
          fi
          git clone --bare https://github.com/jo32/tvbox-silicon.git /tmp/upstream.git
          cd /tmp/upstream.git
          echo "upstream refs: $(git for-each-ref --format='%(refname)' | wc -l)"
          TARGET="https://x-access-token:${MIRROR_TOKEN}@github.com/mlzbest/mmusic.git"
          BEFORE=$(git ls-remote "$TARGET" refs/heads/main | awk '{print $1}')
          git remote set-url --push origin "$TARGET"
          # --mirror = force + prune: mlzbest/mmusic becomes byte-identical
          # to jo32/tvbox-silicon, including every branch and tag.
          git push --mirror origin
          AFTER=$(git ls-remote "$TARGET" refs/heads/main | awk '{print $1}')
          echo "MAIN_BEFORE=$BEFORE" >> "$GITHUB_ENV"
          echo "MAIN_AFTER=$AFTER" >> "$GITHUB_ENV"
          if [ "$BEFORE" != "$AFTER" ]; then
            echo "MAIN_CHANGED=true" >> "$GITHUB_ENV"
          else
            echo "MAIN_CHANGED=false" >> "$GITHUB_ENV"
          fi

      # Keep this controller repository active so GitHub does not disable
      # scheduled workflows after 60 days of inactivity.
      # Only build when the source actually changed. A full cold build takes
      # ~57 min, so an unchanged upstream must not trigger one every day.
      - name: Trigger IPA build when upstream main changed
        if: env.MAIN_CHANGED == 'true'
        env:
          GH_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          echo "upstream main moved: $MAIN_BEFORE -> $MAIN_AFTER"
          if ! gh workflow run build-unsigned-ipa.yml --repo mlzbest/upstream-sync --ref main; then
            echo "::warning::IPA build could not be triggered (check MIRROR_TOKEN workflow scope)"
          fi

      - name: Record successful sync
        run: |
          set -e
          echo "$(date -u +%FT%TZ) mirror ok" >> last-sync.log
          git config user.name "mirror-bot"
          git config user.email "mirror-bot@users.noreply.github.com"
          git add last-sync.log
          if ! git diff --staged --quiet; then
            git commit -m "chore: mirror $(date -u +%FT%TZ)"
            git push
          fi
